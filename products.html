    <style>
        /* ============================================================ */
        /*  动态渐变背景 + 浮动光晕                                     */
        /* ============================================================ */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            background: linear-gradient(135deg, #e8f0fe 0%, #d4e0f0 30%, #c8d8ec 60%, #dce6f2 100%);
            background-size: 400% 400%;
            animation: gradientShift 12s ease-in-out infinite alternate;
            color: #0b1a2e;
            position: relative;
            overflow-x: hidden;
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 0%;
            }
            25% {
                background-position: 100% 0%;
            }
            50% {
                background-position: 100% 100%;
            }
            75% {
                background-position: 0% 100%;
            }
            100% {
                background-position: 0% 0%;
            }
        }

        body::before {
            content: '';
            position: fixed;
            top: -15%;
            left: -15%;
            width: 60%;
            height: 70%;
            background: radial-gradient(circle, rgba(120, 180, 255, 0.20) 0%, rgba(120, 180, 255, 0.05) 40%, transparent 70%);
            pointer-events: none;
            z-index: 0;
            animation: floatGlow1 10s ease-in-out infinite alternate;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -15%;
            right: -15%;
            width: 55%;
            height: 60%;
            background: radial-gradient(circle, rgba(200, 180, 255, 0.18) 0%, rgba(200, 180, 255, 0.05) 40%, transparent 70%);
            pointer-events: none;
            z-index: 0;
            animation: floatGlow2 12s ease-in-out infinite alternate;
        }

        .bg-glow-3 {
            position: fixed;
            top: 30%;
            right: -5%;
            width: 40%;
            height: 50%;
            background: radial-gradient(circle, rgba(100, 210, 200, 0.10) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
            animation: floatGlow3 14s ease-in-out infinite alternate;
        }

        @keyframes floatGlow1 {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 0.6;
            }
            50% {
                transform: translate(8%, 6%) scale(1.15);
                opacity: 1;
            }
            100% {
                transform: translate(3%, 10%) scale(1.05);
                opacity: 0.8;
            }
        }

        @keyframes floatGlow2 {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 0.5;
            }
            50% {
                transform: translate(-8%, -6%) scale(1.2);
                opacity: 0.9;
            }
            100% {
                transform: translate(-5%, -10%) scale(1.1);
                opacity: 0.7;
            }
        }

        @keyframes floatGlow3 {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 0.3;
            }
            100% {
                transform: translate(-10%, 8%) scale(1.3);
                opacity: 0.7;
            }
        }

        .showcase {
            max-width: 1280px;

        .header .brand-badge .brand-name {

        .header h1 {

		.header h1::before {

        /* ===== 卡片网格 ===== */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2.2rem;
            justify-items: center;
            margin-bottom: 2rem;
            width: 100%;
        }

        /* ===== 卡片 ===== */
        .app-card {
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border-radius: 2.2rem;
            padding: 2rem 1.6rem 1.8rem;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 16px 40px -12px rgba(30, 60, 120, 0.08), 0 2px 16px rgba(0, 0, 0, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: all 0.4s cubic-bezier(0.15, 0.75, 0.3, 1.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: visible;
        }

        .app-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -30%;
            width: 180%;
            height: 80%;
            background: radial-gradient(ellipse at 30% 20%, rgba(120, 180, 255, 0.08) 0%, transparent 70%);
            pointer-events: none;
            opacity: 0.6;
            transition: opacity 0.4s;
        }

        .app-card:nth-child(1)::before {
            background: radial-gradient(ellipse at 30% 20%, rgba(100, 180, 255, 0.12) 0%, transparent 70%);
        }
        .app-card:nth-child(2)::before {
            background: radial-gradient(ellipse at 30% 20%, rgba(80, 210, 160, 0.12) 0%, transparent 70%);
        }
        .app-card:nth-child(3)::before {
            background: radial-gradient(ellipse at 30% 20%, rgba(180, 140, 255, 0.12) 0%, transparent 70%);
        }
        .app-card:nth-child(4)::before {
            background: radial-gradient(ellipse at 30% 20%, rgba(255, 160, 120, 0.12) 0%, transparent 70%);
        }

        .app-card:hover {
            transform: translateY(-8px) scale(1.01);
            box-shadow: 0 32px 60px -16px rgba(30, 60, 120, 0.18);
            background: rgba(255, 255, 255, 0.72);
            border-color: rgba(255, 255, 255, 0.8);
        }

        .app-card:active {
            transform: scale(0.98);
        }

        .app-tag {
            position: absolute;
            top: 0.8rem;
            right: 0.8rem;
            background: linear-gradient(135deg, #4a8bc2, #2a5f8a);
            color: #ffffff;
            font-size: 0.55rem;
            font-weight: 600;
            padding: 0.15rem 0.6rem;
            border-radius: 30px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            z-index: 5;
            box-shadow: 0 2px 12px rgba(42, 95, 138, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .app-tag i {
            margin-right: 2px;
            font-size: 0.5rem;
        }

        .app-icon {
            width: 80px;
            height: 80px;
            border-radius: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
            box-shadow: 0 10px 24px -8px rgba(30, 60, 100, 0.10);
            transition: transform 0.3s ease, box-shadow 0.3s;
            position: relative;
            z-index: 2;
            flex-shrink: 0;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.5);
        }

        .app-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 26px;
        }

        .app-card:hover .app-icon {
            transform: scale(1.04) translateY(-2px);
            box-shadow: 0 16px 32px -10px rgba(30, 60, 100, 0.16);
        }

        .app-name {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.05rem;
            margin-bottom: 0.1rem;
            position: relative;
            z-index: 2;

        .app-name-cn {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: #0b1a2e;
            line-height: 1.2;
        }

        .app-name-en {
            font-size: 0.7rem;
            font-weight: 400;
            color: #7a94b0;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .app-desc {
            font-size: 0.85rem;
            font-weight: 400;
            color: #5a7a96;

            margin-top: 0.2rem;

            position: relative;
            z-index: 2;
        }

        /* ============================================================ */
        /*  ★ 二维码悬停浮层效果                                        */
        /* ============================================================ */

        .qr-wrapper {
            position: relative;
            z-index: 10;
            display: inline-block;
            cursor: default;
        }

        /* 小二维码显示区域 */
        .qr-thumb {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 0.6rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.7);
            transition: all 0.3s ease;
            min-width: 132px;
            min-height: 132px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qr-thumb .qr-code-container {
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            background: #ffffff;
            overflow: hidden;
        }

        .qr-thumb .qr-code-container canvas {
            width: 120px !important;
            height: 120px !important;
            display: block !important;
            border-radius: 14px;
        }

        /* ★ 悬停浮层 */
        .qr-popup {
            position: absolute;
            bottom: calc(100% + 16px);
            left: 50%;
            transform: translateX(-50%) scale(0.92);
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: 24px;
            padding: 1.4rem 1.4rem 1rem;
            box-shadow: 0 32px 72px rgba(20, 40, 80, 0.20), 0 8px 24px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.8);
            opacity: 0;
            visibility: hidden;
            transition: all 0.35s cubic-bezier(0.15, 0.75, 0.3, 1.1);
            z-index: 999;
            pointer-events: none;
            min-width: 220px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.4rem;
        }

        .qr-popup::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 10px solid transparent;
            border-top-color: rgba(255, 255, 255, 0.96);
        }

        .qr-wrapper:hover .qr-popup {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) scale(1);
            pointer-events: auto;
        }

        .qr-wrapper:hover .qr-thumb {
            border-color: #8ab4d6;
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 8px 28px rgba(30, 60, 110, 0.08);
        }

        .qr-popup .qr-big {
            width: 200px;
            height: 200px;
            border-radius: 16px;
            background: #ffffff;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.02);
        }

        .qr-popup .qr-big canvas {
            width: 200px !important;
            height: 200px !important;
            display: block !important;
            border-radius: 16px;
        }

        .qr-popup .qr-popup-label {
            font-size: 0.7rem;
            font-weight: 500;
            color: #3d6a8e;
            letter-spacing: 0.5px;
            text-transform: uppercase;

            letter-spacing: 0.5px;

            text-transform: uppercase;
            margin-top: 0.3rem;

        .footer {

    <script>
        // ★ 二维码数据
        var appData = [{
            id: 'innoclock',
            name: '创意时钟',
            url: 'https://apps.apple.com/app/id1643819605'
        }, {
            id: 'pixvault',
            name: '私密相册',
            url: 'https://apps.apple.com/app/id6788408711'
        }, {
            id: 'flipclock',
            name: '翻页时钟',
            url: 'https://apps.apple.com/app/id6443968056'
        }];

        // ★ 等待 jQuery 和 qrcode 插件加载完成
        function generateAllQRCodes() {
            // 检查 qrcode 插件是否可用
            if (typeof $.fn.qrcode !== 'function') {
                setTimeout(generateAllQRCodes, 300);
                return;
            }

            appData.forEach(function(item) {
                // 缩略图 120px
                var thumbSelector = '#qr-' + item.id + '-thumb';
                var thumbContainer = $(thumbSelector);
                if (thumbContainer.length) {
                    thumbContainer.empty();
                    thumbContainer.qrcode({
                        render: 'canvas',
                        width: 120,
                        height: 120,
                        text: item.url,
                        typeNumber: 10,
                        correctLevel: 3,
                        background: '#ffffff',
                        foreground: '#1a3a5a'
                    });
                    thumbContainer.find('canvas').css({
                        'width': '120px',
                        'height': '120px',
                        'border-radius': '14px',
                        'display': 'block'
                    });
                }

                // 大图 200px
                var popupSelector = '#qr-' + item.id + '-popup';
                var popupContainer = $(popupSelector);
                if (popupContainer.length) {
                    popupContainer.empty();
                    popupContainer.qrcode({
                        render: 'canvas',
                        width: 200,
                        height: 200,
                        text: item.url,
                        typeNumber: 10,
                        correctLevel: 3,
                        background: '#ffffff',
                        foreground: '#1a3a5a'
                    });
                    popupContainer.find('canvas').css({
                        'width': '200px',
                        'height': '200px',
                        'border-radius': '16px',
                        'display': 'block'
                    });
                }
            });
        }

        // ★ DOM 加载完成后生成
        $(document).ready(function() {
            // 延迟 200ms 确保所有库加载完成
            setTimeout(generateAllQRCodes, 200);
        });

        // ★ 备用：window load
        $(window).on('load', function() {
            var hasQR = $('.qr-code-container canvas').length > 0;
            if (!hasQR) {
                generateAllQRCodes();
            }
        });

    </script>
